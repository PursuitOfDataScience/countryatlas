url: https://pursuitofdatascience.github.io/countryatlas/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2166AC"

home:
  title: countryatlas • Join world data to maps on the ISO spine
  description: >
    A complete toolkit for getting country data onto honest maps, using ISO
    codes as the universal join key.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/getting-started.html
      - text: Joining your own data
        href: articles/joining-your-own-data.html
      - text: Modern maps with sf & projections
        href: articles/sf-and-projections.html
      - text: Beyond the choropleth
        href: articles/beyond-the-choropleth.html
      - text: "Honest maps: classification, missingness and distortion"
        href: articles/honest-maps.html
      - text: countryatlas and ggsql
        href: articles/countryatlas-and-ggsql.html
      - text: "Full introduction (formal)"
        href: articles/countryatlas.html

reference:
- title: Core data assembly
  desc: One call to a map-ready table, the light analysis table, and bare geometry.
  contents:
  - world_data
  - country_data
  - world_geometry
  - locate_country
  - country_borders
  - neighbors
  - distance_between

- title: Data sources beyond the World Bank
  desc: >
    One verb, many providers. A registry rather than more Suggests, so a source
    with no CRAN package is still first class -- and a way to find out where
    two providers disagree.
  contents:
  - register_country_source
  - country_sources
  - fetch_indicator
  - add_indicator
  - compare_sources
  - source_adapters
  - clear_country_cache

- title: Time
  desc: >
    Historical borders, dated group membership, existence spans, and a check
    that a panel respects when countries actually existed.
  contents:
  - historical_geometry
  - country_timeline
  - audit_time_coverage

- title: The join engine
  desc: The package's mission, exposed for your own data.
  contents:
  - standardize_country
  - join_world
  - attach_geometry
  - country_join
  - country_join_all
  - dissolve_country

- title: Diagnostics & data quality
  desc: Never lose a country silently.
  contents:
  - check_country_match
  - repair_country_names
  - country_overrides
  - audit_coverage

- title: Reference data & code translation
  contents:
  - convert_country
  - country_codes
  - country_groups
  - in_group
  - wdi_search

- title: Analysis helpers
  contents:
  - per_capita
  - rate_check
  - smooth_rates
  - deflate
  - to_ppp
  - interpolate_missing
  - convergence_club
  - aggregate_regions
  - rank_countries
  - complete_years
  - growth_rate
  - index_to
  - share_of_world
  - lag_by_country
  - correlate_indicators
  - beta_convergence
  - sigma_convergence
  - gini
  - theil

- title: Spatial statistics
  desc: >
    Weights first, statistics second. country_weights() is the piece that lets
    an island participate at all -- and lets adjacency be something other than
    geography.
  contents:
  - country_weights
  - morans_i
  - local_morans
  - lisa_map
  - gearys_c
  - getis_ord
  - spatial_lag

- title: Visualization
  desc: A full vocabulary of projected, area-honest maps.
  contents:
  - world_map
  - globe_map
  - spin_globe
  - facet_map
  - bubble_map
  - spike_map
  - bivariate_map
  - cartogram_map
  - dorling_map
  - tile_map
  - flow_map
  - animate_world
  - interactive_map
  - value_by_alpha_map
  - gridded_cartogram
  - geom_country_labels
  - theme_world_map
  - simplify_geometry

- title: Honest maps
  desc: >
    Say which classification you chose and what it did, show where the data is
    not, and make projection distortion visible rather than asserted.
  contents:
  - classify_compare
  - coverage_map
  - projection_info
  - projection_compare
  - projection_distortion
  - tissot_map
  - cartogram_diagnostics
  - map_provenance
  - dispute_policy
  - check_dispute_coverage

- title: Flows and networks
  desc: Bilateral data on the ISO spine.
  contents:
  - flow_matrix
  - country_network
  - od_map

- title: Reporting
  desc: For the audience that wanted a table.
  contents:
  - country_factsheet
  - world_table

- title: Subnational
  desc: >
    Below the country level, scoped to where a maintained code system and free
    geometry both exist.
  contents:
  - standardize_subnational
  - nuts_geometry
  - subnational_map

- title: Database rendering (ggsql)
  desc: Hand curated tables to ggsql for database-side spatial rendering.
  contents:
  - as_ggsql_source
  - world_query

- title: Performance & caching
  contents:
  - clear_wdi_cache

- title: Bundled datasets
  contents:
  - world_snapshot
  - country_meta
  - common_indicators
  - country_groups_tbl
  - world_tiles
  - historical_codes
  - country_groups_history
  - disputed_territories

- title: Package
  contents:
  - countryatlas-package
