# Monthly dry run of the data builds (T4): rebuild the classification table,
# the bundled datasets and the dated group memberships from their live sources,
# without committing anything, and fail on any validation error. This is how a
# renamed World Bank region or a reshaped classification file is noticed before
# a user notices it.
on:
  schedule:
    - cron: "41 5 3 * *"
  workflow_dispatch:

name: data-dry-run

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # usethis because country_groups_history.R ends in usethis::use_data(). It is
      # in neither Imports nor Suggests, so nothing else installs it, and both runs
      # of this workflow before it was added stopped there with "there is no
      # package called 'usethis'", before build_datasets.R had run at all.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::readxl, any::jsonlite, any::maps, any::usethis
          needs: check

      - name: Rebuild every dataset from its source
        run: |
          Rscript data-raw/country_classifications.R
          Rscript data-raw/country_groups_history.R
          Rscript data-raw/build_datasets.R

      - name: Summarise what changed
        if: always()
        run: git status --short data/ >> "$GITHUB_STEP_SUMMARY"
