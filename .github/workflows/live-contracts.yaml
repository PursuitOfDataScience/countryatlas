# Weekly live contract tests (T3) and upstream-version watch (T5).
#
# Every adapter test replays a recorded response, so the suite checks the
# parsers against the shape each provider had on the day it was recorded --
# which is how fetch_owid() and fetch_oecd() could be dead for a whole release
# with every test green. This job makes one small real request per provider,
# re-records the fixtures and uploads them for review. Nothing here commits:
# a changed fixture is a changed provider, and a person reads the diff.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

name: live-contracts

permissions: read-all

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      COUNTRYATLAS_LIVE: "true"
      COMTRADE_PRIMARY: ${{ secrets.COMTRADE_PRIMARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat, any::readxl, any::jsonlite
          needs: check

      - name: Live contract tests
        run: |
          pkgload::load_all(".")
          testthat::test_file("tests/testthat/test-live-contracts.R",
                              reporter = c("summary", "fail"))
        shell: Rscript {0}

      - name: Re-record the fixtures
        if: always()
        run: Rscript data-raw/record_fixtures.R

      - name: Upload the re-recorded fixtures for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures-${{ github.run_id }}
          path: tests/testthat/fixtures/

      - name: Upstream versions
        if: always()
        run: Rscript .github/scripts/upstream-versions.R >> "$GITHUB_STEP_SUMMARY"
